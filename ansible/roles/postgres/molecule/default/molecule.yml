---
dependency:
  name: galaxy
  options:
    requirements-file: collections/requirements.yml

driver:
  name: docker

platforms:
  - name: ubuntu2404-postgres
    image: ubuntu:24.04
    privileged: true
    command: /sbin/init
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    capabilities:
      - SYS_ADMIN
    environment:
      DEBIAN_FRONTEND: noninteractive
    groups:
      - postgres_servers

provisioner:
  name: ansible
  inventory:
    group_vars:
      postgres_servers:
        postgres_version: "16"
        postgres_max_connections: 100
        postgres_shared_buffers: "1GB"
        postgres_effective_cache_size: "3GB"
        postgres_ssl: false
        pgbouncer_enabled: true
        pgbackrest_enabled: true
        postgres_databases:
          - name: testdb
            owner: testuser
        postgres_users:
          - name: testuser
            password: testpass123
            db: testdb
            priv: "ALL"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy